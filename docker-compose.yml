version: '3.8'

services:
  backend:
    build: 
      context: ./backend
    container_name: talklyai-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
    container_name: talklyai-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://your-ec2-public-ip
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: talklyai-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
